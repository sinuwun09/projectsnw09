<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator RPM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}#btnAi,#btnStop,#aiNote{display:none!important}

/* Layout: meja kerja dua kolom — formulir di kiri, lembar RPM (kertas A4) di kanan; satu kolom di ponsel. */
:root {
  --bg: #eef1ee; --surface: #ffffff; --surface-2: #f5f7f5; --line: #d5dbd6;
  --fg: #18211b; --muted: #5b675f; --accent: #0a7d3e; --on-accent: #ffffff;
  --accent-soft: #e2f3e8; --danger: #b3261e; --peach: #fce5cd;
  --paper: #ffffff; --ink: #111111; --doc-green: #00b050; --doc-peach: #fce5cd;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-doc: "Times New Roman", Times, "Liberation Serif", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121613; --surface: #1b211d; --surface-2: #222a25; --line: #354038;
  --fg: #e8eee9; --muted: #9daba1; --accent: #45c97f; --on-accent: #06200f;
  --accent-soft: #1d3527; --danger: #ff8a80; --peach: #4a3a28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121613; --surface: #1b211d; --surface-2: #222a25; --line: #354038;
  --fg: #e8eee9; --muted: #9daba1; --accent: #45c97f; --on-accent: #06200f;
  --accent-soft: #1d3527; --danger: #ff8a80; --peach: #4a3a28; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-text); font-size: 14px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in, .wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px }
.brand { flex: 1 1 200px; min-width: 0 }
.brand h1 { font-family: var(--font-head); font-size: 18px; font-weight: 600; margin: 0; line-height: 1.2 }
.brand p { margin: 0; color: var(--muted); font-size: 12px }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.note { font-size: 12px; color: var(--muted) }
.note.err { color: var(--danger) }

button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; font-weight: 500 }
button:hover { background: var(--surface-2) }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600 }
button.primary:hover { filter: brightness(1.08); background: var(--accent) }
button:disabled { opacity: .55; cursor: not-allowed }
button.mini { padding: 3px 8px; font-size: 12px }
button.del { color: var(--danger) }

.wrap { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 24px; padding-block: 20px 48px; align-items: start }
@media (max-width: 960px) { .wrap { grid-template-columns: minmax(0, 1fr) } }

.form { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px }
.sec > h2 { font-family: var(--font-head); font-size: 14px; font-weight: 600; margin: 0; display: flex; gap: 8px; align-items: baseline }
.sec > h2 .ltr { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; background: var(--doc-green); color: #fff; font-size: 12px; flex: none }
.sec.ai { background: var(--accent-soft); border-color: transparent }
.manual { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px }
.manual .lbl { margin: 0 }
.steps { margin: 0; padding-left: 18px }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.fld > label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted) }
.hint { font-size: 11.5px; color: var(--muted); margin: 0 }
input[type=text], input[type=number], textarea, select { font: inherit; width: 100%; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px }
textarea { resize: vertical; min-height: 58px; line-height: 1.45 }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr } }
.dims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px }
@media (max-width: 420px) { .dims { grid-template-columns: 1fr } }
.dims label { display: flex; gap: 7px; align-items: flex-start; font-size: 13px }
.dims input { margin-top: 3px; accent-color: var(--accent) }
.meet { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2) }
.meet-h, .step-h { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.meet-h strong { font-family: var(--font-head) }
.step { border-left: 3px solid var(--peach); padding-left: 10px; display: flex; flex-direction: column; gap: 6px }

.pv { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px) }
@media (max-width: 960px) { .pv { position: static } }
.pv-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px }
.pv-h span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em }
.pv-scroll { max-height: calc(100vh - 130px); overflow: auto; border-radius: 4px }
@media (max-width: 960px) { .pv-scroll { max-height: none } }

/* Lembar RPM — kertas tetap putih di kedua tema, seperti hasil cetak */
.paper { background: var(--paper); color: var(--ink); font-family: var(--font-doc); font-size: 15px; line-height: 1.5; max-width: 794px; margin: 0 auto; padding: 8% 9%; box-shadow: 0 1px 4px rgba(0,0,0,.25); overflow-wrap: anywhere }
@media (max-width: 560px) { .paper { font-size: 12.5px; padding: 7% 6% } }
.paper h3 { text-align: center; font-size: 1em; margin: 0 0 1.4em; letter-spacing: .02em }
.paper p { margin: 0; text-align: justify }
.paper table { border-collapse: collapse; width: 100%; table-layout: fixed }
.paper .g { background: var(--doc-green); border: 1px solid #000; font-weight: bold; padding: 1px 8px }
.paper .idt td { padding: 2px 4px; vertical-align: top }
.paper .idt td.l { padding-left: 22px; width: 34% } .paper .idt td.c { width: 5% }
.paper .n1 { font-weight: bold; margin-top: 1em; padding-left: 20px; text-indent: -20px; text-align: left }
.paper .n2 { font-weight: bold; margin-top: .6em; padding-left: 40px; text-indent: -20px; text-align: left }
.paper .b1 { padding-left: 20px } .paper .b2 { padding-left: 40px }
.paper ul { margin: 0; padding-left: 20px; list-style: none }
.paper ul.b1 { padding-left: 42px } .paper ul.b2 { padding-left: 62px }
.paper li { position: relative }
.paper li::before { position: absolute; left: -20px; content: "•" }
.paper ul.arrow li::before { content: "➢"; font-size: .85em; top: .1em }
.paper ul.check li::before { content: "✓" }
.paper .km { display: grid; grid-template-columns: 9em 1fr; gap: 0 4px }
.paper .dim { width: calc(100% - 20px); margin: .3em 0 0 20px }
.paper .dim td { border: 1px solid #000; padding: 1px 6px }
.paper .dim td.v { width: 6%; text-align: center; font-weight: bold }
.paper .hd { font-weight: bold; margin-top: 1.2em }
.paper .mt { margin-top: 1em }
.paper .pt td, .paper .pt th { border: 1px solid #000; padding: 3px 6px; vertical-align: top; text-align: left }
.paper .pt th { background: var(--doc-peach); font-size: .84em; text-align: center; vertical-align: middle; line-height: 1.3 }
.paper .pt td:first-child { font-weight: bold }
.paper .gap { height: 1em }
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="brand"><h1>Generator RPM</h1><p>Rencana Pembelajaran Mendalam — isi formulir, unduh sebagai Word</p></div>
  <div class="actions">
    <span class="note" id="dlNote" aria-live="polite"></span>
    <button type="button" id="btnExample">Muat contoh</button>
    <button type="button" id="btnClear">Kosongkan</button>
    <button type="button" class="primary" id="btnDocx" disabled>Unduh .docx</button>
  </div>
</div></div>

<div class="wrap">
  <div class="form" id="form"></div>
  <div class="pv">
    <div class="pv-h"><span>Pratinjau dokumen</span></div>
    <div class="pv-scroll"><div class="paper" id="paper"></div></div>
  </div>
</div>

<script>
(function () {
"use strict";
var DIMS = ["Keimanan dan Ketakwaan terhadap Tuhan YME", "Kewargaan", "Penalaran Kritis", "Kreativitas", "Kolaborasi", "Kemandirian", "Kesehatan", "Komunikasi"];
var KEY = "rpm-draft-v1";

function example() { return {
  sekolah: "SMKN 1 TANGERANG",
  mapel: "KK TKJ / Perencanaan dan pengalamatan jaringan",
  program: "Teknik Jaringan Komputer dan Telekomunikasi",
  kelas: "XI TKJ",
  waktu: "18 JP X 45 Menit",
  murid: "Sebagian murid sudah memahami konsep dasar biner dan IP Address Kelas A/B/C standar, namun masih kesulitan dalam melakukan segmentasi jaringan heterogen menggunakan teknik CIDR dan perhitungan efisiensi alokasi host berbasis VLSM.",
  materi: "Praktik berbasis logika matematis, analisis kebutuhan infrastruktur jaringan, serta implementasi konfigurasi logis (*addressing plan*) dan fisik pada perangkat jaringan.",
  dimensi: [true, false, false, false, true, false, false, true],
  topik: "**Produk Proyek (PjBL):** Dokumen Perencanaan Jaringan (*Network Design & Addressing Blueprints*) serta Simulasi Topologi dan Implementasi Pengalamatan IP berbasis VLSM/CIDR untuk Gedung Perkantoran / Sekolah 3 Lantai",
  tujuan: "Memahami perencanaan topologi dan arsitektur jaringan sesuai kebutuhan\nMemahami pengumpulan kebutuhan teknis pengguna jaringan\nMemahami pengumpulan data peralatan jaringan dengan teknologi yang sesuai\nMemahami perancangan pengalamatan jaringan\nMemahami perhitungan Subnetting CIDR dan VLSM",
  praktik: "*Project-Based Learning* (PjBL) terintegrasi prinsip *Deep Learning* (Mindful, Meaningful, Joyful).",
  kemitraan: "Matematika : Logika konversi bilangan biner-desimal dan eksponensial (2ⁿ)\nBahasa Indonesia : Penyusunan laporan teknis\nKIK : Estimasi Biaya & Perencanaan Kebutuhan Sarana",
  lingkungan: "Laboratorium Komputer Jaringan dengan koneksi LAN/Simulator",
  digital: "Software Simulator Jaringan Cisco Packet Tracer\n*IP Subnet Calculator*\nSoftware aplikasi visualisasi topologi Draw.io",
  pertemuan: [
    { langkah: [
      { nama: "Pendahuluan", aktivitas: "Guru memberi salam, selanjutnya menanyakan kabar murid\nSalah satu murid memimpin berdoa sebelum memulai pelajaran\nGuru mengecek kehadiran murid\nGuru menyampaikan tujuan pembelajaran yang akan dicapai\nGuru menyampaikan manfaat materi pembelajaran\nGuru menyampaikan rencana kegiatan yang akan dilakukan\nGuru menyampaikan ruang lingkup penilaian\nGuru memberi motivasi dan semangat kepada murid", sumber: "" },
      { nama: "Penentuan Pertanyaan Mendasar (*Meaningful*)", aktivitas: "Guru menayangkan video perbandingan jaringan tanpa subnetting vs jaringan berstruktur subnetting.\nGuru menyajikan studi kasus : **\"Sebuah gedung 3 lantai memiliki 5 divisi dengan kebutuhan jumlah komputer yang berbeda drastis (mulai dari 5 host hingga 60 host). Jika hanya diberikan 1 blok IP /24, bagaimana cara membaginya agar tidak ada konflik dan IP tidak terbuang sia-sia?\"**", sumber: "" },
      { nama: "Mendesain Perencanaan Proyek", aktivitas: "", sumber: "" }
    ] },
    { langkah: [{ nama: "", aktivitas: "", sumber: "" }] },
    { langkah: [{ nama: "", aktivitas: "", sumber: "" }] }
  ],
  formatif: "", sumatif: "",
  ai: { topik: "", model: "Project-Based Learning (PjBL)", n: 3, catatan: "" }
}; }
function blank() {
  var s = example();
  ["sekolah","mapel","program","kelas","waktu","murid","materi","topik","tujuan","praktik","kemitraan","lingkungan","digital"].forEach(function (k) { s[k] = ""; });
  s.dimensi = DIMS.map(function () { return false; });
  s.pertemuan = [{ langkah: [{ nama: "", aktivitas: "", sumber: "" }] }];
  return s;
}

var state = example();
try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.pertemuan && saved.dimensi) state = Object.assign(example(), saved); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function lines(s) { return String(s || "").split(/\r?\n/).map(function (x) { return x.replace(/^\s*[-•*]\s+/, "").trim(); }).filter(Boolean); }
/* **tebal** dan *miring* */
function inline(s) {
  var out = [], re = /\*\*([^*]+)\*\*|\*([^*\n]+)\*/g, last = 0, m;
  s = String(s || "");
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ t: s.slice(last, m.index) });
    out.push(m[1] != null ? { t: m[1], b: true } : { t: m[2], i: true });
    last = re.lastIndex;
  }
  if (last < s.length) out.push({ t: s.slice(last) });
  return out;
}
function ih(s) { return inline(s).map(function (r) { var t = esc(r.t); if (r.b) t = "<b>" + t + "</b>"; if (r.i) t = "<i>" + t + "</i>"; return t; }).join(""); }
function kmSplit(l) { var i = l.indexOf(":"); return i < 0 ? [l, ""] : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; }

/* ---------- form ---------- */
function fid(path) { return "f-" + path.replace(/\./g, "-"); }
function get(path) { return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, state); }
function set(path, v) { var ks = path.split("."), o = state; for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
function inp(label, path, ph) { return '<div class="fld"><label for="' + fid(path) + '">' + label + '</label><input type="text" id="' + fid(path) + '" data-path="' + path + '" value="' + esc(get(path)) + '" placeholder="' + esc(ph || "") + '"></div>'; }
function ta(label, path, rows, ph) { return '<div class="fld"><label for="' + fid(path) + '">' + label + '</label><textarea id="' + fid(path) + '" data-path="' + path + '" rows="' + (rows || 3) + '" placeholder="' + esc(ph || "") + '">' + esc(get(path)) + '</textarea></div>'; }

function renderForm() {
  var h = "";
  h += '<section class="sec ai"><h2>Isi otomatis dengan AI</h2>' +
    '<p class="hint">Lengkapi Identitas di bawah, tulis topiknya, lalu AI menyusun bagian B sampai E. Hasilnya tetap bisa Anda sunting.</p>' +
    inp("Topik / materi pokok", "ai.topik", "mis. Subnetting CIDR dan VLSM") +
    '<div class="row2"><div class="fld"><label for="f-ai-model">Model pembelajaran</label><select id="f-ai-model" data-path="ai.model">' +
    ["Project-Based Learning (PjBL)", "Problem-Based Learning (PBL)", "Discovery Learning", "Inquiry Learning", "Teaching Factory (TeFa)", "Pembelajaran Berdiferensiasi"].map(function (m) { return "<option" + (m === state.ai.model ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") +
    '</select></div><div class="fld"><label for="f-ai-n">Jumlah pertemuan</label><input type="number" id="f-ai-n" data-path="ai.n" min="1" max="8" value="' + esc(state.ai.n) + '"></div></div>' +
    ta("Catatan tambahan (opsional)", "ai.catatan", 2, "mis. kondisi murid, alat yang tersedia, produk yang diharapkan") +
    '<div class="actions"><button type="button" class="primary" id="btnAi" data-act="ai" disabled>Susun dengan Claude</button><button type="button" id="btnStop" data-act="stop" hidden>Batalkan</button><span class="note" id="aiNote" aria-live="polite"></span></div>' +
    '<div class="manual"><p class="lbl">Cara salin–tempel (Claude, ChatGPT, Gemini, dll.)</p>' +
    '<ol class="hint steps"><li>Klik <b>Salin perintah</b>, lalu tempel di obrolan AI pilihan Anda.</li><li>Salin seluruh jawaban AI, tempel di kotak di bawah, lalu klik <b>Terapkan jawaban</b>.</li></ol>' +
    '<div class="actions"><button type="button" data-act="copyp">Salin perintah</button><span class="note" id="cpNote" aria-live="polite"></span></div>' +
    '<textarea id="promptBox" rows="5" readonly hidden aria-label="Perintah untuk AI"></textarea>' +
    '<textarea id="pasteBox" rows="4" placeholder="Tempel jawaban AI di sini…" aria-label="Jawaban AI"></textarea>' +
    '<div class="actions"><button type="button" class="primary" data-act="applyp">Terapkan jawaban</button><span class="note" id="apNote" aria-live="polite"></span></div></div></section>';

  h += '<section class="sec"><h2><span class="ltr">A</span>Identitas</h2>' +
    inp("Sekolah", "sekolah") + inp("Mata Pelajaran / Elemen", "mapel") + inp("Program Keahlian", "program") +
    '<div class="row2">' + inp("Kelas", "kelas") + inp("Waktu", "waktu", "mis. 18 JP X 45 Menit") + '</div></section>';

  h += '<section class="sec"><h2><span class="ltr">B</span>Identifikasi</h2>' +
    ta("1. Identifikasi Murid", "murid", 4) + ta("2. Identifikasi Materi Pembelajaran", "materi", 3) +
    '<div class="fld"><span class="lbl">3. Dimensi Profil Lulusan</span><div class="dims">' +
    DIMS.map(function (d, i) { return '<label for="f-dim-' + i + '"><input type="checkbox" id="f-dim-' + i + '" data-dim="' + i + '"' + (state.dimensi[i] ? " checked" : "") + '>' + esc(d) + '</label>'; }).join("") +
    '</div></div></section>';

  h += '<section class="sec"><h2><span class="ltr">C</span>Desain Pembelajaran</h2>' +
    '<p class="hint">Daftar ditulis satu butir per baris. Gunakan *miring* untuk istilah asing dan **tebal** untuk penekanan.</p>' +
    ta("1. Topik Pembelajaran", "topik", 3) + ta("2. Tujuan Pembelajaran (satu per baris)", "tujuan", 5) +
    ta("3a. Praktik Pedagogis", "praktik", 2) + ta("3b. Kemitraan Pembelajaran (Mapel : uraian, satu per baris)", "kemitraan", 3, "Matematika : ...") +
    ta("3c. Lingkungan Pembelajaran", "lingkungan", 2) + ta("3d. Pemanfaatan Digital (satu per baris)", "digital", 3) + '</section>';

  h += '<section class="sec"><h2><span class="ltr">D</span>Pengalaman Belajar</h2>';
  state.pertemuan.forEach(function (p, pi) {
    h += '<div class="meet"><div class="meet-h"><strong>Pertemuan ' + (pi + 1) + '</strong>' +
      (state.pertemuan.length > 1 ? '<button type="button" class="mini del" data-act="delp" data-p="' + pi + '">Hapus pertemuan</button>' : "") + '</div>';
    p.langkah.forEach(function (l, li) {
      var base = "pertemuan." + pi + ".langkah." + li;
      h += '<div class="step"><div class="step-h"><span class="lbl">Langkah ' + (li + 1) + '</span>' +
        (p.langkah.length > 1 ? '<button type="button" class="mini del" data-act="dell" data-p="' + pi + '" data-l="' + li + '">Hapus</button>' : "") + '</div>' +
        inp("Langkah Pembelajaran", base + ".nama", "mis. Pendahuluan") +
        ta("Aktivitas Pembelajaran (satu per baris)", base + ".aktivitas", 4) +
        ta("Sumber Materi Pembelajaran", base + ".sumber", 2) + '</div>';
    });
    h += '<div><button type="button" class="mini" data-act="addl" data-p="' + pi + '">+ Tambah langkah</button></div></div>';
  });
  h += '<div><button type="button" data-act="addp">+ Tambah pertemuan</button></div></section>';

  h += '<section class="sec"><h2><span class="ltr">E</span>Asesmen</h2>' +
    ta("1. Asesmen Formatif", "formatif", 3) + ta("2. Asesmen Sumatif", "sumatif", 3) + '</section>';
  document.getElementById("form").innerHTML = h;
  syncCaps();
}

/* ---------- pratinjau ---------- */
function blockH(text, cls) {
  var ls = lines(text);
  if (!ls.length) return '<p class="' + cls + '">&nbsp;</p>';
  if (ls.length === 1) return '<p class="' + cls + '">' + ih(ls[0]) + '</p>';
  return '<ul class="' + cls + '">' + ls.map(function (l) { return "<li>" + ih(l) + "</li>"; }).join("") + "</ul>";
}
function listH(text, cls) { var ls = lines(text); return ls.length ? '<ul class="' + cls + '">' + ls.map(function (l) { return "<li>" + ih(l) + "</li>"; }).join("") + "</ul>" : '<p class="b1">&nbsp;</p>'; }
function renderPreview() {
  var s = state, h = "<h3>RENCANA PEMBELAJARAN MENDALAM</h3>";

  });
  if (pts.length) state.pertemuan = pts;
  state.formatif = str(d.formatif); state.sumatif = str(d.sumatif);
}
function aiPrompt() {
  var s = state, n = Math.max(1, Math.min(8, parseInt(s.ai.n, 10) || 3));
  return "Anda adalah guru dan pengembang kurikulum di Indonesia. Susun isi Rencana Pembelajaran Mendalam (RPM) dengan pendekatan Pembelajaran Mendalam (berkesadaran/mindful, bermakna/meaningful, menggembirakan/joyful) dalam Bahasa Indonesia yang baku.\n\n" +
    "DATA:\n- Sekolah: " + s.sekolah + "\n- Mata Pelajaran/Elemen: " + s.mapel + "\n- Program Keahlian: " + s.program + "\n- Kelas: " + s.kelas + "\n- Alokasi waktu: " + s.waktu +
    "\n- Topik/materi pokok: " + s.ai.topik + "\n- Model pembelajaran: " + s.ai.model + "\n- Jumlah pertemuan: " + n + "\n- Catatan guru: " + (s.ai.catatan || "-") + "\n\n" +
    "Balas HANYA dengan satu objek JSON (tanpa teks lain, tanpa pagar kode) dengan bentuk persis:\n" +
    '{"identifikasiMurid": "1 paragraf kesiapan/pengetahuan awal murid", "identifikasiMateri": "1 paragraf jenis pengetahuan dan karakter materi", ' +
    '"dimensi": ["2-4 nama dari: ' + DIMS.join("; ") + '"], "topik": "topik atau produk pembelajaran", "tujuan": ["3-6 tujuan pembelajaran terukur"], ' +
    '"praktik": "model pembelajaran dan integrasi prinsip pembelajaran mendalam", "kemitraan": [{"mapel": "mata pelajaran/pihak mitra", "uraian": "bentuk kolaborasi"}], ' +
    '"lingkungan": "lingkungan belajar fisik/virtual", "digital": ["perangkat lunak/platform yang dipakai"], ' +
    '"pertemuan": [{"langkah": [{"nama": "nama langkah", "aktivitas": ["aktivitas guru dan murid"], "sumber": "sumber materi"}]}], ' +
    '"formatif": ["bentuk asesmen formatif"], "sumatif": ["bentuk asesmen sumatif"]}\n\n' +
    "ATURAN:\n- Buat tepat " + n + " pertemuan. Tiap pertemuan memuat langkah Pendahuluan, langkah-langkah inti mengikuti sintaks " + s.ai.model + " (sebarkan sintaks secara berurutan antarpertemuan dan tandai prinsip Mindful/Meaningful/Joyful pada nama langkah bila sesuai), lalu Penutup berisi refleksi.\n" +
    "- Tiap langkah berisi 3-8 aktivitas konkret dan spesifik pada topik, satu kalimat per aktivitas.\n- Gunakan kata \"murid\", bukan \"siswa\".\n- Apit istilah asing dengan satu tanda bintang (*contoh*). Jangan gunakan markdown lain.";
}
function runAi() {
  var note = document.getElementById("aiNote");
  if (!caps.sample || busy) return;
  if (!state.ai.topik.trim() && !state.mapel.trim()) { note.className = "note err"; note.textContent = "Isi topik atau mata pelajaran terlebih dahulu."; return; }
  busy = true; ctl = new AbortController();
  var t0 = Date.now(), stop = document.getElementById("btnStop");
  note.className = "note"; note.textContent = "Claude sedang menyusun… bisa memakan 1–2 menit.";
  stop.hidden = false; syncCaps();
  var tick = setInterval(function () { var n2 = document.getElementById("aiNote"); if (n2) n2.textContent = "Claude sedang menyusun… " + Math.round((Date.now() - t0) / 1000) + " dtk"; }, 1000);
  var msg = "", err = false;
  caps.sample.json(aiPrompt(), { signal: ctl.signal }).then(function (d) {
    if (!d || typeof d !== "object") throw { code: "invalid_json" };
    applyAi(d); save(); msg = "Selesai. Periksa dan sunting hasilnya di bawah.";
  }).catch(function (e) {
    var c = e && e.code; err = c !== "cancelled";
    msg = c === "cancelled" ? "Dibatalkan." : c === "not_granted" ? "Izin memakai Claude tidak diberikan." : c === "rate_limited" ? "Terlalu banyak permintaan. Coba lagi sebentar lagi." : c === "invalid_json" ? "Jawaban tidak terbaca. Coba susun ulang." : "Gagal menyusun. Coba lagi.";
  }).then(function () {
    clearInterval(tick); busy = false; ctl = null;
    renderForm(); renderPreview();
    var n3 = document.getElementById("aiNote"); n3.className = err ? "note err" : "note"; n3.textContent = msg;
  });
}

/* ---------- salin–tempel ke AI mana pun ---------- */
function copyPrompt() {
  var note = document.getElementById("cpNote"), box = document.getElementById("promptBox");
  note.className = "note";
  if (!state.ai.topik.trim() && !state.mapel.trim()) { note.className = "note err"; note.textContent = "Isi topik atau mata pelajaran terlebih dahulu."; return; }
  var text = aiPrompt();
  box.value = text;
  var fallback = function () { box.hidden = false; box.focus(); box.select(); note.textContent = "Perintah sudah dipilih — tekan Ctrl+C (atau tahan lalu Salin) untuk menyalin."; };
  try {
    navigator.clipboard.writeText(text).then(function () { box.hidden = true; note.textContent = "Perintah tersalin. Tempel di obrolan AI."; }, fallback);
  } catch (e) { fallback(); }
}
function applyPasted() {
  var note = document.getElementById("apNote"), raw = document.getElementById("pasteBox").value;
  var a = raw.indexOf("{"), z = raw.lastIndexOf("}");
  var d = null;
  if (a >= 0 && z > a) { try { d = JSON.parse(raw.slice(a, z + 1)); } catch (e) { d = null; } }
  if (!d || typeof d !== "object") {
    note.className = "note err";
    note.textContent = raw.trim() ? "Jawaban tidak terbaca. Pastikan seluruh jawaban AI ikut tersalin, dari tanda { pertama sampai } terakhir." : "Tempel jawaban AI terlebih dahulu.";
    return;
  }
  applyAi(d); save(); renderForm(); renderPreview();
  var n2 = document.getElementById("apNote"); n2.className = "note"; n2.textContent = "Jawaban diterapkan. Periksa dan sunting hasilnya di bawah.";
}

/* ---------- events ---------- */
var form = document.getElementById("form");
form.addEventListener("input", function (e) {
  var t = e.target;
  if (t.dataset.dim != null) state.dimensi[+t.dataset.dim] = t.checked;
  else if (t.dataset.path) set(t.dataset.path, t.value);
  else return;
  save(); if (!t.dataset.path || t.dataset.path.indexOf("ai.") !== 0) renderPreview();
});
form.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-act]"); if (!b) return;
  var a = b.dataset.act, p = +b.dataset.p, l = +b.dataset.l;
  if (a === "ai") return runAi();
  if (a === "copyp") return copyPrompt();
  if (a === "applyp") return applyPasted();
  if (a === "stop") { if (ctl) ctl.abort(); return; }
  if (a === "addp") state.pertemuan.push({ langkah: [{ nama: "", aktivitas: "", sumber: "" }] });
  if (a === "delp") state.pertemuan.splice(p, 1);
  if (a === "addl") state.pertemuan[p].langkah.push({ nama: "", aktivitas: "", sumber: "" });
  if (a === "dell") state.pertemuan[p].langkah.splice(l, 1);
  save(); renderForm(); renderPreview();
});
document.getElementById("btnClear").addEventListener("click", function () { var ai = state.ai; state = blank(); state.ai = ai; save(); renderForm(); renderPreview(); });
document.getElementById("btnExample").addEventListener("click", function () { state = example(); save(); renderForm(); renderPreview(); });

renderForm(); renderPreview();
})();
</script>
</body>
</html>
